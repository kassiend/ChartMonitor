// Compose compiler stability configuration (plan §5).
// Marks the following as stable so UI models and immutable collections don't
// make Composables non-skippable in -PcomposeReports.

// Feature domain + UI models (ChartMonitorState, GeneratorItemUi, PointSeries...) — @Immutable
// is also set on the data classes, this is belt-and-suspenders for wildcard coverage.
com.dauren.monitor.feature.chartmonitor.domain.model.*
com.dauren.monitor.feature.chartmonitor.ui.*
// Chart primitives
com.dauren.monitor.core.chart.*

// kotlinx-collections-immutable
kotlinx.collections.immutable.ImmutableList
kotlinx.collections.immutable.ImmutableSet
kotlinx.collections.immutable.ImmutableMap
kotlinx.collections.immutable.PersistentList
kotlinx.collections.immutable.PersistentSet
kotlinx.collections.immutable.PersistentMap

// kotlinx-coroutines flows (used by LiveChart as a point-batch pipe).
// Treating as stable is safe for consumers: SharedFlow API is observe-only, no mutation surface.
kotlinx.coroutines.flow.SharedFlow
kotlinx.coroutines.flow.StateFlow

// kotlin.time.Duration (value class, treated as unstable by default)
kotlin.time.Duration
